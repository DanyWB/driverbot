[drive-phangan]
user = drive-phangan
group = drive-phangan

listen = /run/php/drive-phangan.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

chdir = /srv/drive-phangan/current/backend
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /var/log/php/drive-phangan-slow.log

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/log/php/drive-phangan-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 12M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[max_execution_time] = 120
php_admin_value[date.timezone] = Asia/Bangkok
security.limit_extensions = .php
