[global]
pid = /run/drive-phangan-preview/php-fpm.pid
error_log = /srv/drive-phangan-preview/shared/logs/fpm-master.log
daemonize = no

[drive-phangan-preview]
user = drive-phangan-preview
group = drive-phangan-preview
listen = /run/drive-phangan-preview/php.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 250
chdir = /srv/drive-phangan-preview/current/backend
clear_env = yes
env[APP_ENV] = production
env[LARAVEL_STORAGE_PATH] = /srv/drive-phangan-preview/shared/storage
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 45s
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /srv/drive-phangan-preview/shared/logs/php-error.log
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 64K
php_admin_value[upload_max_filesize] = 64K
php_admin_value[max_execution_time] = 30
php_admin_value[date.timezone] = Asia/Bangkok
php_admin_value[open_basedir] = /srv/drive-phangan-preview:/usr/share/php:/etc/ssl/certs:/tmp
