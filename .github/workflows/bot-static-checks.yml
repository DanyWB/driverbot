name: bot-static-checks

on:
  push:
    branches:
      - origin
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        working-directory: .
        run: |
          node --test scripts/check-secrets.test.js
          node scripts/check-secrets.js
          node scripts/check-sensitive-history.js

      - name: Validate deployment shell scripts
        working-directory: .
        run: |
          bash -n deploy/scripts/*.sh deploy/tests/*.sh
          bash deploy/tests/release-hardening.test.sh

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run unit tests
        run: npm test

      - name: Check translation parity
        run: npm run check:translations

      - name: Check Laravel data mode boot
        run: npm run check:laravel-mode

      - name: Check concurrent Redis sessions
        env:
          REDIS_URL: redis://127.0.0.1:6379/1
        run: npm run check:redis-session
