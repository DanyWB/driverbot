<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Drive Phangan</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system,
                    BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #0d1117;
                color: #f8fafc;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 2rem;
                background:
                    radial-gradient(circle at top, #164e63 0, transparent 42%),
                    #0d1117;
            }

            main {
                width: min(42rem, 100%);
                text-align: center;
            }

            p {
                margin: 0;
                color: #bae6fd;
                font-size: clamp(1rem, 2vw, 1.2rem);
                letter-spacing: 0.04em;
            }

            h1 {
                margin: 0.75rem 0 1rem;
                font-size: clamp(2.75rem, 9vw, 6rem);
                line-height: 0.95;
                letter-spacing: -0.06em;
            }

            small {
                display: block;
                color: #94a3b8;
                font-size: 0.95rem;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main>
            <p>Koh Phangan vehicle rental</p>
            <h1>Drive Phangan</h1>
            <small>
                Website coming soon.<br />
                Сайт готовится к запуску.
            </small>
        </main>
    </body>
</html>
