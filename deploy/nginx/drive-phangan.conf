server {
    listen 80;
    listen [::]:80;
    server_name drivephangan.com www.drivephangan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://drivephangan.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.drivephangan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://admin.drivephangan.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.drivephangan.com;

    ssl_certificate /etc/letsencrypt/live/drive-phangan-site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive-phangan-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://drivephangan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drivephangan.com;

    root /srv/drive-phangan/shared/landing;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/drive-phangan-site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive-phangan-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/drive-phangan-site.access.log;
    error_log /var/log/nginx/drive-phangan-site.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.drivephangan.com;

    root /srv/drive-phangan/current/backend/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/drive-phangan-admin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive-phangan-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12m;
    access_log /var/log/nginx/drive-phangan.access.log;
    error_log /var/log/nginx/drive-phangan.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/drive-phangan.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
