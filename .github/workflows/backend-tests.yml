name: backend-tests

on:
  push:
    branches:
      - origin
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phangan_test
          POSTGRES_USER: phangan
          POSTGRES_PASSWORD: phangan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phangan -d phangan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: gd, exif, fileinfo, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Assert Linux CMS media capabilities
        run: |
          php -r 'if (PHP_OS_FAMILY !== "Linux") { exit(1); } foreach (["gd", "exif", "fileinfo", "pdo_pgsql"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing CMS extension: ".$extension.PHP_EOL); exit(1); } } $gd = gd_info(); foreach (["JPEG Support", "PNG Support", "WebP Support"] as $feature) { if (empty($gd[$feature])) { fwrite(STDERR, "Missing GD feature: ".$feature.PHP_EOL); exit(1); } } echo "Linux CMS capabilities: gd/jpeg/png/webp, exif, fileinfo, pdo_pgsql".PHP_EOL;'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Run CI checks
        run: composer ci:check

      - name: Assert Linux shared-root CMS media boundary is not skipped
        run: php artisan test --filter='WebsitePresentationFoundationTest::test_trusted_shared_storage_symlink_is_allowed_but_child_symlink_is_rejected' --fail-on-skipped

      - name: Run PostgreSQL constraints, concurrency, and timezone tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: phangan_test
          DB_USERNAME: phangan
          DB_PASSWORD: phangan_test
          DB_SSLMODE: disable
        run: |
          php artisan migrate --force
          php artisan test --filter='Postgres|PricingPresetReadSnapshotTest|VehicleQuoteReadSnapshotTest'
          for app_timezone in UTC Europe/Moscow Asia/Bangkok; do
            APP_TIMEZONE="$app_timezone" php artisan test --filter=PendingRequestPolicyTest
          done

      - name: Verify real locked Linux production bot dependency tree
        run: |
          npm_home="$(mktemp -d)"
          : >"$npm_home/user.npmrc"
          : >"$npm_home/global.npmrc"
          run_npm() {
            env -i PATH="$PATH" HOME="$npm_home" NODE_ENV=production npm --prefix ../bot \
              --cache "$npm_home/cache" --userconfig="$npm_home/user.npmrc" --globalconfig="$npm_home/global.npmrc" \
              --registry=https://registry.npmjs.org --fund=false --update-notifier=false "$@"
          }
          run_npm ci --omit=dev --ignore-scripts --no-audit
          run_npm audit --omit=dev
          run_npm ls --omit=dev --all
          php ../ops/pricing-20261031/check-bot-runtime.php
